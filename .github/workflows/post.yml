name: Post dhikr video

on:
  schedule:
    # Checks every hour. The script itself only posts when config.json says it is due (default: every 2 hours).
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post now, even if it is not time yet'
        type: boolean
        default: false
      dry_run:
        description: 'Make the video but do NOT upload it (test)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dhikr-post
  cancel-in-progress: false

env:
  FORCE: ${{ inputs.force }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Is it time to post?
        id: gate
        run: node scripts/gate.mjs

      - name: Install tools
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-inter
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Make and post the video
        if: steps.gate.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/make.mjs

      - name: Save the posting history
        if: steps.gate.outputs.go == 'true' && inputs.dry_run != true
        run: |
          git config user.name "dhikr-bot"
          git config user.email "dhikr-bot@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || (git commit -m "Posted a dhikr video" && git pull --rebase && git push)

      - name: Keep the test video
        if: steps.gate.outputs.go == 'true' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 3
